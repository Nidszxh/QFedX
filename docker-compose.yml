version: '3.8'

services:
  server:
    build: .
    container_name: qfl_server
    ports:
      - "8080:8080"
    environment:
      - SERVER_ADDRESS=0.0.0.0:8080
      - PYTHONPATH=/workspace/src
    volumes:
      - ./logs:/workspace/logs
      - ./checkpoints:/workspace/checkpoints
    command: ["server"]

  client1:
    build: .
    container_name: qfl_client1
    environment:
      - SERVER_ADDRESS=qfl_server:8080
      - PYTHONPATH=/workspace/src
    depends_on:
      - server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["client"]

  client2:
    build: .
    container_name: qfl_client2
    environment:
      - SERVER_ADDRESS=qfl_server:8080
      - PYTHONPATH=/workspace/src
