name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libomp-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint
      run: ruff check src/

    - name: Import check
      run: |
        python -c "import sys; sys.path.insert(0, 'src'); from quantum.qnn import QuantumNeuralNetworkConfig, QuantumNeuralNetwork; print('qnn imports OK')"
        python -c "import sys; sys.path.insert(0, 'src'); from quantum.qfl import QuantumFederatedLearning; print('qfl imports OK')"
        python -c "import sys; sys.path.insert(0, 'src'); from quantum.privacy.differential_privacy import DifferentialPrivacy; from quantum.privacy.privacy_accountant import PrivacyAccountant; from quantum.privacy.secure_aggregation import SecureAggregator; print('Privacy imports OK')"
        python -c "import sys; sys.path.insert(0, 'src'); from quantum.noise import NoiseConfig, NoiseModel; print('Noise imports OK')"
        python -c "import sys; sys.path.insert(0, 'src'); from core.utils import set_seed, get_logger; from core.data import create_dataloader; from core.fl import federated_averaging; print('Core imports OK')"

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short -x
